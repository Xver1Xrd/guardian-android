name: Android checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-37.2' 'build-tools;36.0.0' 'platform-tools'
      - run: python3 scripts/check_bidi.py
      - run: ./gradlew :core:crypto:test :feature:generator:test :feature:authenticator:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

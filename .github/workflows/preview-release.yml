name: Preview release
on:
  push:
    tags:
      - 'v*-preview'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-37.2' 'build-tools;36.0.0' 'platform-tools'
      - run: python3 scripts/check_bidi.py
      - run: ./gradlew :core:crypto:test :feature:generator:test :feature:authenticator:test :app:assembleDebug :app:lintDebug --no-daemon
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Guardian-v0.1-preview-debug.apk
          cd dist
          sha256sum Guardian-v0.1-preview-debug.apk > SHA256SUMS.txt
      - name: Upload and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/Guardian-v0.1-preview-debug.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
